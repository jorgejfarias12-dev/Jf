<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1412">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Boletins">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icone.svg">
<link rel="apple-touch-icon" href="/icone.svg">
<title>Futebol e Boletins</title>
<style>
  :root { --fundo:#f3f5f3; --cartao:#fff; --texto:#17201c; --suave:#5f6d67; --linha:#dde3df;
          --marca:#14532d; --marca-texto:#fff; --verde:#16803c; --vermelho:#c0262d; --ambar:#a35d00;
          --sel:#14532d; --sel-texto:#fff; }
  @media (prefers-color-scheme: dark) {
    :root { --fundo:#0f1412; --cartao:#19201d; --texto:#e9eeeb; --suave:#9aa8a1; --linha:#2b3430;
            --marca:#1f7a45; --verde:#4cc684; --vermelho:#f2837f; --ambar:#e7a446;
            --sel:#4cc684; --sel-texto:#0f1412; } }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; background:var(--fundo); color:var(--texto);
               font:16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { position:sticky; top:0; z-index:5; background:var(--marca); color:var(--marca-texto);
           padding:calc(env(safe-area-inset-top) + 12px) 16px 10px; }
  header h1 { margin:0; font-size:1.15rem; }
  header p { margin:2px 0 0; font-size:.8rem; opacity:.85; }
  main { padding:12px 16px calc(84px + env(safe-area-inset-bottom)); max-width:640px; margin:0 auto; }
  .separador { display:none; } .separador.ativo { display:block; }
  .dias { display:flex; gap:8px; margin-bottom:12px; overflow-x:auto; }
  .chip { border:1px solid var(--linha); background:var(--cartao); color:var(--texto);
          padding:8px 14px; border-radius:999px; font:inherit; font-size:.9rem; white-space:nowrap; }
  .chip.ativo { background:var(--marca); color:var(--marca-texto); border-color:var(--marca); }
  h2.liga { font-size:.85rem; text-transform:uppercase; letter-spacing:.04em; color:var(--suave);
            margin:18px 0 6px; }
  .jogo { background:var(--cartao); border:1px solid var(--linha); border-radius:12px;
          padding:10px 12px; margin-bottom:8px; }
  .linha1 { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .equipas { font-weight:600; }
  .res { font-weight:800; font-size:1.1rem; font-variant-numeric:tabular-nums; min-width:44px; text-align:right; }
  .info { font-size:.8rem; color:var(--suave); margin-top:2px; }
  .vivo { color:var(--verde); font-weight:700; }
  .escolhas { display:grid; grid-template-columns:repeat(6, 1fr); gap:6px; margin-top:8px; }
  .escolhas button { font:inherit; font-weight:700; font-size:.9rem; padding:9px 0; border-radius:8px;
                     border:1px solid var(--linha); background:var(--fundo); color:var(--texto); }
  .escolhas button.sel { background:var(--sel); color:var(--sel-texto); border-color:var(--sel); }
  .escolhas button:disabled { opacity:.35; }
  .escolhas.golos { grid-template-columns:repeat(4, 1fr); margin-top:6px; }
  .escolhas.golos button { font-size:.8rem; }
  .stats { margin-top:8px; padding-top:8px; border-top:1px dashed var(--linha); }
  .st { display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:.85rem; margin-top:4px; }
  .st-nome { font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .st-num { font-size:.75rem; color:var(--suave); margin-bottom:2px; }
  .st-vazio { font-size:.75rem; color:var(--suave); margin-top:6px; }
  .forma { display:flex; gap:3px; flex-shrink:0; }
  .f { width:18px; height:18px; border-radius:4px; font-size:.65rem; font-weight:800; display:grid; place-items:center; color:#fff; }
  .f.v { background:var(--verde); } .f.e { background:#8a948f; } .f.d { background:var(--vermelho); }
  .escolhas button.sugerido:not(.sel) { border:2px solid var(--ambar); }
  .sug { margin-top:8px; padding:8px 10px; border-radius:8px; font-size:.85rem;
         background:color-mix(in srgb, var(--ambar) 12%, transparent); }
  .sug small { color:var(--suave); }
  .sug-nota { font-size:.7rem; color:var(--suave); margin-top:3px; }
  .valor-linha { font-size:.75rem; margin-top:3px; }
  .vl-bom { color:var(--verde); font-weight:600; } .vl-mau { color:var(--vermelho); font-weight:600; }
  .vl-neutro { color:var(--suave); }
  .vazio { text-align:center; color:var(--suave); padding:40px 10px; }
  .cartao { background:var(--cartao); border:1px solid var(--linha); border-radius:12px; padding:12px; margin-bottom:10px; }
  .sel-linha { display:grid; grid-template-columns:1fr 84px 36px; gap:8px; align-items:center;
               padding:8px 0; border-top:1px solid var(--linha); }
  .sel-linha:first-child { border-top:0; }
  input.num.fonte { grid-column:1 / -1; text-align:left; font-size:.9rem; padding:7px 8px; }
  .fontes { width:100%; border-collapse:collapse; font-size:.85rem; font-variant-numeric:tabular-nums; }
  .fontes th { font-size:.7rem; font-weight:600; color:var(--suave); text-align:right; padding:4px 3px; }
  .fontes td { text-align:right; padding:7px 3px; border-top:1px solid var(--linha); }
  .fontes th:first-child, .fontes td:first-child { text-align:left; }
  .fontes td:first-child { font-weight:600; max-width:120px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .fontes .pos { color:var(--verde); font-weight:700; } .fontes .neg { color:var(--vermelho); font-weight:700; }
  .fontes .peq { display:block; font-size:.65rem; font-weight:400; color:var(--ambar); }
  .so-dicas { background:color-mix(in srgb, var(--suave) 18%, transparent); color:var(--suave); }
  .sel-nome { font-size:.9rem; } .sel-nome b { display:block; font-size:.95rem; }
  input.num { width:100%; font:inherit; font-size:1rem; padding:9px 8px; border-radius:8px;
              border:1px solid var(--linha); background:var(--fundo); color:var(--texto); text-align:center; }
  .x { font:inherit; font-size:1.2rem; border:0; background:none; color:var(--suave); padding:6px; }
  .totais { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:4px; }
  .total { background:var(--fundo); border-radius:10px; padding:10px; text-align:center; }
  .total span { display:block; font-size:.75rem; color:var(--suave); }
  .total strong { font-size:1.25rem; font-variant-numeric:tabular-nums; }
  label.campo { display:block; font-size:.85rem; color:var(--suave); margin:10px 0 4px; }
  .botao { display:block; width:100%; font:inherit; font-weight:700; padding:13px; border-radius:10px;
           border:0; background:var(--marca); color:var(--marca-texto); margin-top:10px; }
  .botao.sec { background:var(--fundo); color:var(--texto); border:1px solid var(--linha); }
  .aviso { border-left:4px solid var(--ambar); font-size:.9rem; }
  .nota { font-size:.8rem; color:var(--suave); margin-top:8px; }
  .estado-bol { font-size:.75rem; font-weight:700; padding:3px 8px; border-radius:999px; white-space:nowrap; }
  .ganho { background:color-mix(in srgb, var(--verde) 18%, transparent); color:var(--verde); }
  .perdido { background:color-mix(in srgb, var(--vermelho) 18%, transparent); color:var(--vermelho); }
  .pendente { background:color-mix(in srgb, var(--ambar) 18%, transparent); color:var(--ambar); }
  .bol-sel { font-size:.85rem; padding:4px 0; display:flex; justify-content:space-between; gap:8px; }
  .acoes { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
  .acoes button { font:inherit; font-size:.8rem; padding:6px 10px; border-radius:8px;
                  border:1px solid var(--linha); background:var(--fundo); color:var(--texto); }
  nav { position:fixed; left:0; right:0; bottom:0; z-index:6; display:grid; grid-template-columns:repeat(4,1fr);
        background:var(--cartao); border-top:1px solid var(--linha); padding-bottom:env(safe-area-inset-bottom); }
  nav button { font:inherit; font-size:.8rem; padding:10px 0 12px; border:0; background:none; color:var(--suave); }
  nav button.ativo { color:var(--marca); font-weight:700; }
  @media (prefers-color-scheme: dark) { nav button.ativo { color:var(--verde); } }
  nav .ic { display:block; font-size:1.3rem; line-height:1.2; }
  .contador { display:inline-block; min-width:18px; padding:0 5px; border-radius:9px; background:var(--vermelho);
              color:#fff; font-size:.7rem; font-weight:700; margin-left:3px; }
  .toast { position:fixed; left:50%; bottom:90px; transform:translateX(-50%); background:var(--texto); color:var(--fundo);
           padding:10px 16px; border-radius:10px; font-size:.9rem; opacity:0; transition:opacity .2s; pointer-events:none; z-index:9; }
  .toast.on { opacity:1; }
</style>
</head>
<body>
<header>
  <h1>Futebol e Boletins</h1>
  <p id="sub">A carregar jogos…</p>
</header>

<main>
  <!-- PROPOSTAS -->
  <section id="s-propostas" class="separador ativo">
    <div id="propostas"></div>
  </section>

  <!-- JOGOS -->
  <section id="s-jogos" class="separador">
    <div class="dias" id="dias"></div>
    <div id="lista"></div>
  </section>

  <!-- BOLETIM -->
  <section id="s-boletim" class="separador">
    <div id="boletim"></div>
  </section>

  <!-- BANCA -->
  <section id="s-banca" class="separador">
    <div id="banca"></div>
  </section>
</main>

<nav>
  <button data-sep="propostas" class="ativo"><span class="ic">🎯</span>Propostas</button>
  <button data-sep="jogos"><span class="ic">⚽</span>Jogos</button>
  <button data-sep="boletim"><span class="ic">🧾</span>Boletim<span id="n-sel"></span></button>
  <button data-sep="banca"><span class="ic">💶</span>Banca</button>
</nav>
<div class="toast" id="toast"></div>

<script>
// ---------- armazenamento no telemóvel (protegido) ----------
const guardar = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const ler = (k, omissao) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : omissao; } catch (e) { return omissao; } };

let selecao = ler('selecao_v1', {});      // id do jogo -> {id, data, casa, fora, liga, inicio, escolha, odd}
let boletins = ler('boletins_v1', []);    // histórico
let limite = ler('limite_v1', null);      // limite mensal (€)
let valorBoletim = ler('valor_v1', '');
let diaAtual = null, dados = null;
const cacheDias = {};                     // data -> resposta /api/jogos

const ESCOLHAS = ['1', 'X', '2', '1X', 'X2', '12'];
const GOLOS = ['+2.5', '-2.5', 'AM', 'AMN'];
const NOME_ESCOLHA = { '1': 'Vitória casa', 'X': 'Empate', '2': 'Vitória fora',
                       '1X': 'Casa ou empate', 'X2': 'Empate ou fora', '12': 'Casa ou fora',
                       '+2.5': 'Mais de 2,5 golos', '-2.5': 'Menos de 2,5 golos',
                       'AM': 'Ambas marcam: sim', 'AMN': 'Ambas marcam: não' };
const ROTULO = { '+2.5': '+2,5', '-2.5': '−2,5', 'AM': 'AM sim', 'AMN': 'AM não' };
const rotulo = e => ROTULO[e] || e;
let maxBoletim = ler('max_boletim_v1', null);  // valor máximo por boletim (€)
let ultimaFonte = ler('ultima_fonte_v1', 'Eu'); // fonte sugerida para novas escolhas
const SEM_FONTE = 'Sem fonte';
const AMOSTRA_MINIMA = 30;                      // abaixo disto, os números dizem pouco
const nomeFonte = f => String(f ?? '').trim() || SEM_FONTE;
const ANULADOS = new Set(['PST', 'CANC', 'ABD']);

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const euros = n => (Number.isFinite(n) ? n : 0).toLocaleString('pt-PT', { style: 'currency', currency: 'EUR' });
const num = s => { const n = parseFloat(String(s).replace(',', '.')); return Number.isFinite(n) ? n : NaN; };
const horaLocal = iso => new Date(iso).toLocaleTimeString('pt-PT', { hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Lisbon' });
const dataLisboa = (desloc = 0) => { const d = new Date(Date.now() + desloc * 864e5);
  return d.toLocaleDateString('en-CA', { timeZone: 'Europe/Lisbon' }); };
const mesDe = iso => iso.slice(0, 7);
function toast(t) { const el = document.getElementById('toast'); el.textContent = t; el.classList.add('on'); setTimeout(() => el.classList.remove('on'), 1800); }

// ---------- navegação ----------
document.querySelectorAll('nav button').forEach(b => b.onclick = () => abrir(b.dataset.sep));
function abrir(sep) {
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('ativo', b.dataset.sep === sep));
  document.querySelectorAll('.separador').forEach(s => s.classList.toggle('ativo', s.id === 's-' + sep));
  if (sep === 'boletim') desenharBoletim();
  if (sep === 'banca') { desenharBanca(); avaliarPendentes(); }
  window.scrollTo(0, 0);
}

// ---------- jogos ----------
const DIAS = [[-1, 'Ontem'], [0, 'Hoje'], [1, 'Amanhã']];
let diasComJogos = [];                    // [{data, jogos}] vindos do servidor
const nomeDia = d => new Date(d + 'T12:00:00Z').toLocaleDateString('pt-PT',
  { weekday: 'short', day: '2-digit', month: '2-digit', timeZone: 'UTC' }).replace('.', '');
async function obterDias() {
  try { const r = await fetch('/api/dias', { cache: 'no-store' }); if (r.ok) diasComJogos = (await r.json()).dias; } catch (e) {}
}
const proximosDiasComJogos = () => diasComJogos.filter(x => x.data >= dataLisboa(0) && x.jogos > 0).map(x => x.data);
function desenharDias() {
  const fixos = DIAS.map(([d, n]) => [dataLisboa(d), n]);
  const extra = proximosDiasComJogos().filter(d => d > dataLisboa(1)).slice(0, 6).map(d => [d, nomeDia(d)]);
  document.getElementById('dias').innerHTML = [...fixos, ...extra].map(([d, n]) =>
    `<button class="chip ${d === diaAtual ? 'ativo' : ''}" data-d="${d}">${n}</button>`).join('');
  document.querySelectorAll('#dias .chip').forEach(b => b.onclick = () => carregar(b.dataset.d));
}

async function obterDia(d, forcar = false) {
  if (!forcar && cacheDias[d]) return cacheDias[d];
  const r = await fetch('/api/jogos?data=' + d, { cache: 'no-store' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return (cacheDias[d] = await r.json());
}

async function carregar(d) {
  diaAtual = d; desenharDias();
  try {
    dados = await obterDia(d, true);
    await obterDias(); desenharDias();
    const at = dados.atualizado ? new Date(dados.atualizado).toLocaleTimeString('pt-PT', { hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Lisbon' }) : '—';
    document.getElementById('sub').textContent = `Dados reais da football-data.org (com algum atraso) · atualizado às ${at}`;
  } catch (e) {
    dados = null;
    document.getElementById('sub').textContent = 'Sem ligação ao servidor. Tenta daqui a pouco.';
  }
  desenharJogos();
}

function desenharJogos() {
  const lista = document.getElementById('lista');
  if (!dados || !dados.jogos.length) {
    const prox = proximosDiasComJogos().find(d => d > diaAtual);
    lista.innerHTML = `<div class="vazio">Não há jogos neste dia nas ligas acompanhadas.<br>
      ${prox ? `<button class="chip ativo" style="margin-top:12px" id="ir-prox">Ver os próximos jogos (${nomeDia(prox)})</button>`
             : '<small>A fonte ainda não tem jogos marcados para os próximos dias (pode ser pausa para as seleções).</small>'}</div>`;
    if (prox) document.getElementById('ir-prox').onclick = () => carregar(prox);
    return;
  }
  const term = new Set(dados.terminados), vivo = new Set(dados.a_decorrer);
  const ligas = {};
  dados.jogos.forEach(j => (ligas[`${j.liga_nome} · ${j.pais}`] ??= []).push(j));
  lista.innerHTML = Object.entries(ligas).map(([liga, js]) => `<h2 class="liga">${esc(liga)}</h2>` + js.map(j => {
    const aoVivo = vivo.has(j.estado), acabou = term.has(j.estado);
    const res = j.golos_casa == null ? '—' : `${j.golos_casa}–${j.golos_fora}`;
    const estado = aoVivo ? `<span class="vivo">● Ao vivo${j.minuto ? ' ' + j.minuto + "'" : ''}</span>`
                 : acabou ? esc(j.estado === 'FT' ? 'Terminado' : j.estado_longo)
                 : horaLocal(j.inicio_utc);
    const escolhido = selecao[j.id]?.escolha;
    const sug = acabou || aoVivo ? null : sugestoes(j);
    const sugerido = e => sug && (sug.resultado === e || sug.golos === e);
    const botao = e => `<button data-id="${j.id}" data-e="${e}" class="${escolhido === e ? 'sel' : ''} ${sugerido(e) ? 'sugerido' : ''}"
       ${acabou || aoVivo ? 'disabled' : ''} aria-label="${NOME_ESCOLHA[e]}">${rotulo(e)}</button>`;
    return `<div class="jogo"><div class="linha1"><div><div class="equipas">${esc(j.casa)} – ${esc(j.fora)}</div>
      <div class="info">${estado}</div></div><div class="res">${res}</div></div>
      ${blocoStats(j)}${blocoSugestao(j, sug)}
      <div class="escolhas">${ESCOLHAS.map(botao).join('')}</div>
      <div class="escolhas golos">${GOLOS.map(botao).join('')}</div></div>`;
  }).join('')).join('');
  lista.querySelectorAll('.escolhas button').forEach(b => b.onclick = () => escolher(+b.dataset.id, b.dataset.e));
}

// Estatísticas reais da classificação (nada é estimado; sem dados, não se mostra nada)
const FORMA = { W: ['V', 'v'], D: ['E', 'e'], L: ['D', 'd'] };
const media = (g, n) => n ? (g / n).toFixed(1).replace('.', ',') : '—';
function linhaEquipa(nome, s, onde) {
  if (!s) return '';
  const forma = (s.forma || '').slice(-5).split('').map(c => FORMA[c]
    ? `<span class="f ${FORMA[c][1]}">${FORMA[c][0]}</span>` : '').join('');
  let l = s.local || {};
  // o plano gratuito da fonte só traz a tabela geral; nesse caso mostra-se o total do campeonato
  if (l.j == null && s.total && s.total.j != null) { l = s.total; onde = 'No campeonato'; }
  return `<div class="st"><span class="st-nome">${s.posicao ? s.posicao + '.º ' : ''}${esc(nome)}</span>
    <span class="forma" title="Resultados dos últimos 5 jogos">${forma}</span></div>
    <div class="st-num">${onde}: ${l.v ?? '—'}V ${l.e ?? '—'}E ${l.d ?? '—'}D em ${l.j ?? '—'} jogos ·
      marca ${media(l.gm, l.j)} e sofre ${media(l.gs, l.j)} por jogo</div>`;
}
function blocoStats(j) {
  if (!j.stats_casa && !j.stats_fora) return j.classificacao_indisponivel
    ? '<div class="st-vazio">Classificação não disponível na fonte de dados para esta competição.</div>'
    : '<div class="st-vazio">Classificação ainda não recolhida.</div>';
  return `<div class="stats">${linhaEquipa(j.casa, j.stats_casa, 'Em casa')}${linhaEquipa(j.fora, j.stats_fora, 'Fora')}</div>`;
}

// ---------- sugestões (cálculo a partir dos golos reais do campeonato; é uma estimativa, não uma certeza) ----------
const JOGOS_MINIMOS = 5;          // com menos jogos disputados não se sugere nada
const PROB_SIMPLES = 0.55;        // só se sugere 1, X ou 2 sozinho a partir desta probabilidade
const pctInt = p => Math.round(p * 100) + '%';
const oddJusta = p => (1 / p).toFixed(2).replace('.', ',');
function registoGeral(s) {
  if (!s) return null;
  const l = (s.local && s.local.j != null) ? s.local : s.total;
  return l && l.j >= JOGOS_MINIMOS && l.gm != null && l.gs != null ? l : null;
}
function probabilidades(j) {
  const c = registoGeral(j.stats_casa), f = registoGeral(j.stats_fora);
  if (!c || !f) return null;
  // golos esperados: ataque de uma equipa combinado com a defesa da outra
  const lc = (c.gm / c.j + f.gs / f.j) / 2, lf = (f.gm / f.j + c.gs / c.j) / 2;
  const pois = (l, k) => { let p = Math.exp(-l); for (let i = 1; i <= k; i++) p *= l / i; return p; };
  let p1 = 0, px = 0, p2 = 0, menos = 0;
  for (let a = 0; a <= 10; a++) for (let b = 0; b <= 10; b++) {
    const p = pois(lc, a) * pois(lf, b);
    if (a > b) p1 += p; else if (a === b) px += p; else p2 += p;
    if (a + b <= 2) menos += p;
  }
  const am = (1 - Math.exp(-lc)) * (1 - Math.exp(-lf));
  return { '1': p1, 'X': px, '2': p2, '1X': p1 + px, 'X2': px + p2, '12': p1 + p2,
           '+2.5': 1 - menos, '-2.5': menos, 'AM': am, 'AMN': 1 - am, _lc: lc, _lf: lf };
}
function sugestoes(j) {
  const p = probabilidades(j);
  if (!p) return null;
  const melhor = lista => lista.reduce((a, b) => p[b] > p[a] ? b : a);
  const simples = melhor(['1', 'X', '2']);
  const resultado = p[simples] >= PROB_SIMPLES ? simples : melhor(['1X', 'X2', '12']);
  const golos = melhor(['+2.5', '-2.5', 'AM', 'AMN']);
  return { p, resultado, golos };
}
function blocoSugestao(j, s) {
  if (!s) return '';
  const item = e => `<b>${rotulo(e)}</b> ${pctInt(s.p[e])} <small>(odd justa ${oddJusta(s.p[e])})</small>`;
  return `<div class="sug">💡 Sugestão: ${item(s.resultado)} · ${item(s.golos)}
    <div class="sug-nota">Golos esperados ${s.p._lc.toFixed(1).replace('.', ',')}–${s.p._lf.toFixed(1).replace('.', ',')}.
    Só compensa apostar se a odd do Placard for maior que a odd justa.</div></div>`;
}

function escolher(id, e) {
  const j = dados.jogos.find(x => x.id === id);
  if (selecao[id]?.escolha === e) { delete selecao[id]; toast('Retirado do boletim'); }
  else {
    const p = probabilidades(j);
    selecao[id] = { id, data: j.data_local, casa: j.casa, fora: j.fora, liga: j.liga_nome,
                    inicio: j.inicio_utc, escolha: e, odd: selecao[id]?.escolha === e ? selecao[id].odd : '',
                    fonte: selecao[id]?.fonte ?? ultimaFonte, prob: p ? p[e] : null };
    toast(`${rotulo(e)} · ${j.casa} – ${j.fora}`);
  }
  guardar('selecao_v1', selecao); contarSelecoes(); desenharJogos();
}

function contarSelecoes() {

  document.getElementById('n-sel').innerHTML = n ? `<span class="contador">${n}</span>` : '';
}

// ---------- boletim ----------
function totaisBoletim() {
  const sels = Object.values(selecao);
  const odds = sels.map(s => num(s.odd));
  const completo = sels.length > 0 && odds.every(o => o >= 1.01);
  const oddTotal = completo ? odds.reduce((a, b) => a * b, 1) : NaN;
  const valor = num(valorBoletim);
  return { sels, completo, oddTotal, valor, retorno: completo && valor > 0 ? valor * oddTotal : NaN };
}

function gastoDoMes() {
  const mes = mesDe(dataLisboa());
  return boletins.filter(b => mesDe(b.criado) === mes).reduce((s, b) => s + b.valor, 0);
}

const FONTE_APP = 'Sugestão da app';
const PROB_JUNTAR = 0.65;   // só se juntam ao boletim sugestões com pelo menos esta probabilidade estimada
const MAX_JUNTAR = 3;       // quantas sugestões se juntam de cada vez (menos escolhas = menos risco)
const NOTA_SUGESTOES = `As sugestões vêm de um cálculo com os golos marcados e sofridos por cada equipa no campeonato
  (dados reais da fonte). São estimativas, não certezas: não sabem de lesões, castigos ou motivação. Só compensam se a odd do
  Placard for maior que a «odd justa». A fonte fica registada como «${FONTE_APP}», para veres na Banca se acerta ou não.`;

function textoValor(s) {
  if (s.prob == null) return '<span class="vl-neutro">Sem estimativa (poucos dados da equipa).</span>';
  const base = `Estimativa ${pctInt(s.prob)} · odd justa ${oddJusta(s.prob)}`;
  const odd = num(s.odd);
  if (!(odd >= 1.01)) return `<span class="vl-neutro">${base}</span>`;
  const ganho = s.prob * odd - 1;
  return ganho > 0
    ? `<span class="vl-bom">✅ ${base} · compensa (+${Math.round(ganho * 100)}% esperado)</span>`
    : `<span class="vl-mau">⚠️ ${base} · odd baixa, não compensa (${Math.round(ganho * 100)}%)</span>`;
}

async function juntarSugestoes() {
  const agora = Date.now(), candidatos = [];
  await obterDias();
  for (const d of proximosDiasComJogos().slice(0, 3)) {
    let r; try { r = await obterDia(d); } catch (e) { continue; }
    const term = new Set(r.terminados), vivo = new Set(r.a_decorrer);
    for (const j of r.jogos) {
      if (selecao[j.id] || candidatos.some(c => c.j.id === j.id) || term.has(j.estado) || vivo.has(j.estado) || new Date(j.inicio_utc) <= agora) continue;
      const s = sugestoes(j);
      if (s && s.p[s.resultado] >= PROB_JUNTAR) candidatos.push({ j, e: s.resultado, p: s.p[s.resultado] });
    }
  }
  candidatos.sort((a, b) => b.p - a.p);
  const escolhidos = candidatos.slice(0, MAX_JUNTAR);
  if (!escolhidos.length) { toast('Não há sugestões fortes para os próximos jogos'); return; }
  for (const { j, e, p } of escolhidos)
    selecao[j.id] = { id: j.id, data: j.data_local, casa: j.casa, fora: j.fora, liga: j.liga_nome,
                      inicio: j.inicio_utc, escolha: e, odd: '', fonte: FONTE_APP, prob: p };
  guardar('selecao_v1', selecao); contarSelecoes(); desenharBoletim();
  if (dados) desenharJogos();
  toast(`${escolhidos.length} sugest${escolhidos.length > 1 ? 'ões juntadas' : 'ão juntada'} — escreve as odds do Placard`);
}

function atualizarTotais() {
  const t = totaisBoletim();
  document.getElementById('t-odd').textContent = t.completo ? t.oddTotal.toFixed(2).replace('.', ',') : '—';
  document.getElementById('t-ret').textContent = Number.isFinite(t.retorno) ? euros(t.retorno) : '—';
  const av = document.getElementById('aviso-limite');
  const avisos = [];
  if (maxBoletim && t.valor > maxBoletim)
    avisos.push(`O valor passa o teu máximo por boletim de ${euros(maxBoletim)}.`);
  if (limite && t.valor > 0 && gastoDoMes() + t.valor > limite)
    avisos.push(`Com este boletim passas o teu limite mensal de ${euros(limite)} (já gastaste ${euros(gastoDoMes())} este mês).`);
  av.innerHTML = avisos.length ? `<div class="cartao aviso" style="margin-top:10px">${avisos.join('<br>')}</div>` : '';
}

function guardarBoletim() {
  const t = totaisBoletim();
  if (!t.completo) return toast('Falta a odd de alguma escolha');
  if (!(t.valor > 0)) return toast('Indica o valor apostado');
  if (maxBoletim && t.valor > maxBoletim &&
      !confirm(`O valor passa o teu máximo por boletim de ${euros(maxBoletim)}. Guardar mesmo assim?`)) return;
  if (limite && gastoDoMes() + t.valor > limite &&
      !confirm(`Este boletim ultrapassa o teu limite mensal de ${euros(limite)}. Guardar mesmo assim?`)) return;
  registar(t, t.valor, false);
  toast('Boletim guardado');
}

// Regista as dicas para estatística, sem dinheiro envolvido (valor 0)
function guardarSoDicas() {
  const t = totaisBoletim();
  if (!t.completo) return toast('Falta a odd de alguma escolha');
  registar(t, 0, true);
  toast('Dicas registadas');
}

function registar(t, valor, soDicas) {
  boletins.unshift({ id: Date.now(), criado: dataLisboa(), valor, oddTotal: t.oddTotal, soDicas,
    selecoes: t.sels.map(s => ({ ...s, odd: num(s.odd), fonte: nomeFonte(s.fonte), resultado: null })),
    estado: 'pendente', retorno: 0 });
  guardar('boletins_v1', boletins);
  selecao = {}; valorBoletim = ''; guardar('selecao_v1', selecao); guardar('valor_v1', '');
  contarSelecoes(); abrir('banca');
}

// ---------- estatísticas por fonte (calculadas só com resultados reais) ----------
function fontesConhecidas() {
  return [...new Set(boletins.flatMap(b => b.selecoes.map(s => nomeFonte(s.fonte))))]
    .filter(f => f !== SEM_FONTE).sort((a, b) => a.localeCompare(b, 'pt'));
}

// Cada dica conta como uma aposta simples de 1 € à odd do Placard que registaste:
// certa → ganha (odd − 1); errada → perde 1; anulada → 0 (não entra na contagem).
function estatisticasFontes() {
  const f = {};
  for (const b of boletins) for (const s of b.selecoes) {
    const n = nomeFonte(s.fonte);
    const x = (f[n] ??= { fonte: n, certas: 0, erradas: 0, pendentes: 0, lucro: 0, somaOdd: 0 });
    if (s.resultado === 'certa') { x.certas++; x.lucro += s.odd - 1; x.somaOdd += s.odd; }
    else if (s.resultado === 'errada') { x.erradas++; x.lucro -= 1; x.somaOdd += s.odd; }
    else if (!s.resultado && b.estado === 'pendente') x.pendentes++;
  }
  return Object.values(f).map(x => {
    const n = x.certas + x.erradas;
    return { ...x, n, acerto: n ? x.certas / n : null, roi: n ? x.lucro / n : null, oddMedia: n ? x.somaOdd / n : null };
  }).sort((a, b) => b.n - a.n || a.fonte.localeCompare(b.fonte, 'pt'));
}

const pct = v => v == null ? '—' : (v * 100).toFixed(1).replace('.', ',') + '%';
const pctSinal = v => v == null ? '—' : (v > 0 ? '+' : '') + pct(v);

function blocoFontes() {
  const est = estatisticasFontes();
  if (!est.length) return '';
  return `<h2 class="liga">Fontes das dicas</h2><div class="cartao">
    <table class="fontes"><thead><tr><th>Fonte</th><th>Dicas</th><th>Acerto</th><th>Odd méd.</th><th>ROI</th></tr></thead>
    <tbody>${est.map(x => `<tr><td title="${esc(x.fonte)}">${esc(x.fonte)}
        ${x.n && x.n < AMOSTRA_MINIMA ? `<span class="peq">amostra pequena</span>` : ''}</td>
      <td>${x.n}${x.pendentes ? `<span class="peq" style="color:var(--suave)">+${x.pendentes} por decidir</span>` : ''}</td>
      <td>${pct(x.acerto)}</td>
      <td>${x.oddMedia == null ? '—' : x.oddMedia.toFixed(2).replace('.', ',')}</td>
      <td class="${x.roi == null ? '' : x.roi >= 0 ? 'pos' : 'neg'}">${pctSinal(x.roi)}</td></tr>`).join('')}</tbody></table>
    <p class="nota">Cada dica conta como se apostasses 1 € nela sozinha, à odd do Placard que registaste.
      ROI positivo significa que essa fonte teria dado lucro; o acerto sozinho não chega, porque depende das odds.
      Com menos de ${AMOSTRA_MINIMA} dicas decididas, os números ainda são muito influenciados pela sorte.
      Dicas anuladas não contam.</p></div>`;
}

async function copiarBoletim() {
  const t = totaisBoletim();
  const txt = t.sels.map(s => `${s.casa} – ${s.fora}: ${NOME_ESCOLHA[s.escolha]}${s.odd ? ' @ ' + s.odd : ''}`).join('\n')
    + (t.completo ? `\nOdd total: ${t.oddTotal.toFixed(2)}` : '') + (t.valor > 0 ? `\nValor: ${euros(t.valor)}` : '');
  try { await navigator.clipboard.writeText(txt); toast('Escolhas copiadas'); } catch (e) { toast('Não foi possível copiar'); }
}

// ---------- banca e verificação de resultados ----------
function avaliarSelecao(s, j, term) {
  if (!j || !term.has(j.estado)) return null;
  if (ANULADOS.has(j.estado)) return 'anulada';
  const c = j.golos_90_casa ?? j.golos_casa, f = j.golos_90_fora ?? j.golos_fora;
  if (c == null || f == null) return null;
  const e = s.escolha;
  if (e === '+2.5') return c + f > 2.5 ? 'certa' : 'errada';
  if (e === '-2.5') return c + f < 2.5 ? 'certa' : 'errada';
  if (e === 'AM') return c > 0 && f > 0 ? 'certa' : 'errada';
  if (e === 'AMN') return c > 0 && f > 0 ? 'errada' : 'certa';
  const r = c > f ? '1' : c < f ? '2' : 'X';
  return e.includes(r) ? 'certa' : 'errada';
}

// as duas fontes escrevem os nomes das equipas de forma diferente (ex.: «Sporting CP» / «Sporting Lisbon»)
const RUIDO_NOMES = new Set(['fc','cf','sc','ac','afc','ssc','sv','fk','sk','cd','ud','rc','club','clube','de','da','do',
  'calcio','football','futebol','real','1899','1846','1907']);
const tokensNome = n => new Set(String(n || '').normalize('NFKD').replace(/[\u0300-\u036f]/g, '').toLowerCase()
  .split(/[^a-z0-9]+/).filter(t => t.length >= 3 && !RUIDO_NOMES.has(t)));
function mesmaEquipa(a, b) {
  const ta = [...tokensNome(a)], tb = [...tokensNome(b)];
  if (!ta.length || !tb.length) return String(a).toLowerCase() === String(b).toLowerCase();
  return ta.some(x => tb.some(y => x === y || (Math.min(x.length, y.length) >= 4 && (x.startsWith(y) || y.startsWith(x)))));
}

function fecharBoletim(b) {
  if (b.manual) return;
  if (b.selecoes.some(s => s.resultado === 'errada')) { b.estado = 'perdido'; b.retorno = 0; return; }
  if (b.selecoes.every(s => s.resultado)) {
    const odd = b.selecoes.reduce((p, s) => p * (s.resultado === 'anulada' ? 1 : s.odd), 1);
    b.estado = 'ganho'; b.retorno = b.valor * odd;
  }
}

async function avaliarPendentes() {
  const pend = boletins.filter(b => b.estado === 'pendente');
  const datas = [...new Set(pend.flatMap(b => b.selecoes.map(s => s.data)))];
  let mudou = false;
  for (const d of datas) {
    let r; try { r = await obterDia(d, true); } catch (e) { continue; }
    const term = new Set(r.terminados);
    for (const b of pend) for (const s of b.selecoes) if (s.data === d && !s.resultado) {
      const res = avaliarSelecao(s, r.jogos.find(j => j.id === s.id)
        || r.jogos.find(j => mesmaEquipa(j.casa, s.casa) && mesmaEquipa(j.fora, s.fora)), term);
      if (res) { s.resultado = res; mudou = true; }
    }
  }
  pend.forEach(fecharBoletim);
  if (mudou || pend.some(b => b.estado !== 'pendente')) { guardar('boletins_v1', boletins); desenharBanca(); }
}

        <div class="info">${new Date(b.criado + 'T12:00').toLocaleDateString('pt-PT')}</div></div>

      </div></div>`).join('')
      : '<div class="vazio">Ainda não guardaste boletins.</div>'}
    <p class="nota">Os boletins são verificados com os resultados reais aos 90 minutos. Jogos adiados ou cancelados
      contam como anulados (odd 1), como é habitual; confirma sempre no Placard.
      Os boletins ficam guardados só neste telemóvel. <a href="/estado" style="color:inherit">Estado da recolha</a></p>`;
  document.getElementById('limite').onchange = e => { const v = num(e.target.value);
    limite = v > 0 ? v : null; guardar('limite_v1', limite); desenharBanca(); };
  document.getElementById('max-bol').onchange = e => { const v = num(e.target.value);
    maxBoletim = v > 0 ? v : null; guardar('max_boletim_v1', maxBoletim); desenharBanca(); };
  el.querySelectorAll('[data-marcar]').forEach(x => x.onclick = () => {
    const b = boletins.find(y => y.id === +x.dataset.b);
    b.manual = true; b.estado = x.dataset.marcar; b.retorno = b.estado === 'ganho' ? b.valor * b.oddTotal : 0;
    guardar('boletins_v1', boletins); desenharBanca(); });
  el.querySelectorAll('[data-apagar]').forEach(x => x.onclick = () => { if (confirm('Apagar este boletim do histórico?')) {
    boletins = boletins.filter(y => y.id !== +x.dataset.apagar); guardar('boletins_v1', boletins); desenharBanca(); } });
}

// ---------- arranque ----------
contarSelecoes();
(async () => {
  await obterDias();
  // se hoje não houver jogos, abre o primeiro dia seguinte que tenha
  const hoje = dataLisboa(), comJogos = proximosDiasComJogos();
  carregar(comJogos.includes(hoje) || !comJogos.length ? hoje : comJogos[0]);
})();
setInterval(() => { if (document.visibilityState === 'visible' && diaAtual === dataLisboa()) carregar(diaAtual); }, 120000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') carregar(diaAtual || dataLisboa()); });
</script>
